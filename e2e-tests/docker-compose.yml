version: '3.8'

services:
  e2e-db:
    image: postgres:15-alpine
    container_name: e2e-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: keyvault_e2e
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keyvault_e2e"]
      interval: 3s
      timeout: 3s
      retries: 15

  e2e-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: e2e-backend
    environment:
      PORT: 8080
      DB_HOST: e2e-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: localpassword123
      DB_NAME: keyvault_e2e
      DB_SSLMODE: disable
      JWT_SECRET: e2e-super-secure-jwt-secret-key-123456
      CORS_ALLOWED_ORIGINS: http://e2e-frontend:5173
      DEFAULT_ADMIN_EMAIL: admin@keyvault.local
      DEFAULT_ADMIN_PASSWORD: adminpassword123
    depends_on:
      e2e-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15

  e2e-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: e2e-frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://e2e-backend:8080
      VITE_DEFAULT_ADMIN_EMAIL: admin@keyvault.local
      VITE_DEFAULT_ADMIN_PASSWORD: adminpassword123
    ports:
      - "5174:5173"
    depends_on:
      e2e-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15

  e2e-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e2e-runner
    environment:
      BASE_URL: http://e2e-frontend:5173
    depends_on:
      e2e-frontend:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
