services:
  test-db:
    image: postgres:15-alpine
    container_name: keyvault-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: keyvault_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keyvault_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    container_name: keyvault-test-runner
    command: go test -v ./tests/...
    environment:
      - DB_HOST=test-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=localpassword123
      - DB_NAME=keyvault_test
      - DB_SSLMODE=disable
      - JWT_SECRET=test-secret-key-12345678901234567890
    depends_on:
      test-db:
        condition: service_healthy
